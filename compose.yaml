name: pi-aio-browser-search

services:
  searxng:
    build:
      context: ./docker/searxng
    image: ${SEARXNG_IMAGE:-pi-aio-searxng:local}
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_LIMITER: "false"
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-development-secret-change-me}
      FORCE_OWNERSHIP: "false"
    volumes:
      - searxng-cache:/var/cache/searxng
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request as u;
          u.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  camofox:
    image: ${CAMOFOX_IMAGE:-ghcr.io/jo-inc/camofox-browser:1.13.0}
    container_name: camofox-browser
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9377:9377"
    environment:
      CAMOFOX_BIND_HOST: 0.0.0.0
      CAMOFOX_PORT: "9377"
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-}
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
      MAX_OLD_SPACE_SIZE: "256"
    volumes:
      - camofox-data:/root/.camofox
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 2gb
    mem_limit: 2g
    cpus: 2
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9377/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  searxng-cache:
  camofox-data:
